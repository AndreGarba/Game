# Mesmas checagens que o CLAUDE.md exige antes de abrir PR. O nome do job ("verificar")
# é o que o ruleset da main exige em "Require status checks": renomear aqui quebra a regra.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Push novo no mesmo PR cancela a rodada anterior, que já ficou velha. Na main não: cancelar
# no meio interromperia um deploy. As rodadas da main entram em fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 24: os scripts de simulação rodam .ts direto, sem compilar.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build

  # Casca Android: compila o sabor de produção (APK de debug e AAB de release sem assinatura) e
  # roda o lint do Android. Não publica nada; publicar na Play é manual. O sabor local fica de
  # fora porque depende do dist/ e só serve para teste em aparelho.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cache do Gradle entre rodadas; o runner já traz o Android SDK.
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew assembleProducaoDebug bundleProducaoRelease lintProducaoDebug --console=plain

  # Único caminho para produção: merge na main → verificar passou → deploy. Nunca à mão.
  # Secrets do repositório: CLOUDFLARE_API_TOKEN (permissão "Workers Scripts: Edit") e
  # CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # wrangler pinado no package.json: cada deploy usa a versão que alguém decidiu.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
